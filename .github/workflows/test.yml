name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches:
      - main
      - develop
      - 'feature/*'   # feature 브랜치로의 PR
      - 'release/*'   # release 브랜치로의 PR
      - 'hotfix/*'    # hotfix 브랜치로의 PR
    types:
      - opened      # PR 생성 시
      - synchronize # PR 업데이트 시 (새 커밋 push)
      - reopened    # PR 재오픈 시
      - ready_for_review # PR 리뷰 준비 완료 시

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    
    strategy:
      matrix:
        java-version: [ 21 ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run all module tests (excluding integration tests)
        run: ./gradlew test -x integrationTest --continue --parallel --info

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Gradle Tests
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: |
            **/build/test-results/test/
            **/build/reports/tests/test/
